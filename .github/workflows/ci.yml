# CI do AgroGestão (F08, #32): build, linter e testes em todo PR para develop e master.
#
# Proteção de branch: marque como obrigatório SÓ o check "ci-ok". Os jobs api e web
# rodam apenas quando a respectiva pasta muda e ficam "skipped" no resto; check
# obrigatório pulado bloqueia o merge para sempre. O ci-ok sempre roda, falha se
# algum job falhou ou foi cancelado e passa se eles foram pulados.
#
# A suíte de API do Playwright não roda aqui; entra no CI na Q07.

name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filtro.outputs.api }}
      web: ${{ steps.filtro.outputs.web }}
      web-existe: ${{ steps.web-existe.outputs.existe }}
    steps:
      - uses: actions/checkout@v7

      - id: filtro
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

      # hashFiles não está disponível no "if" de job; a verificação fica aqui.
      - id: web-existe
        run: echo "existe=${{ hashFiles('web/package.json') != '' }}" >> "$GITHUB_OUTPUT"

  # No workflow_dispatch os jobs rodam sempre, sem depender do filtro de caminhos:
  # serve para rodar o CI completo sob demanda em qualquer branch.
  api:
    name: api
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml

      # Sem service de PostgreSQL: os testes de integração sobem o banco pelo
      # Testcontainers, usando o Docker que o runner já tem.
      - run: ./mvnw -B -ntp verify

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste-api
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/
          if-no-files-found: ignore

  web:
    name: web
    needs: changes
    if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true') && needs.changes.outputs.web-existe == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ci-ok:
    name: ci-ok
    if: always()
    # changes entra no needs: se ele falhar, api e web ficam "skipped" e o ci-ok
    # passaria sem ter testado nada.
    needs: [changes, api, web]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          API: ${{ needs.api.result }}
          WEB: ${{ needs.web.result }}
        run: |
          echo "changes=$CHANGES api=$API web=$WEB"
          for r in "$CHANGES" "$API" "$WEB"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Um job do CI falhou ou foi cancelado."
              exit 1
            fi
          done
